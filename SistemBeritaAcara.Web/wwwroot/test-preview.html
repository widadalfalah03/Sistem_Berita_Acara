<!DOCTYPE html>
<html>
<head>
    <script src="https://unpkg.com/jszip/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docx-preview@0.3.2/dist/docx-preview.min.js"></script>
    <style>
        #document-container { width: 100%; height: 600px; overflow-y: auto; background: #e8eaf0; padding: 20px; }
    </style>
</head>
<body>
    <div id="document-container"></div>
    <script>
        fetch('files/documents/ba-1-draft.docx')
            .then(res => res.blob())
            .then(blob => {
                docx.renderAsync(blob, document.getElementById("document-container"))
                    .then(x => console.log("docx: finished"));
            });
    </script>
</body>
</html>
