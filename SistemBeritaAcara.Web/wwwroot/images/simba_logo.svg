<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150" width="100%" height="100%">
  <style>
    .title {
      font-family: 'Segoe UI', Inter, Roboto, Arial, sans-serif;
      font-weight: 900;
      font-size: 88px;
      fill: #003366; /* Deep Corporate Blue */
      letter-spacing: 0.3em;
    }
    .subtitle {
      font-family: 'Segoe UI', Inter, Roboto, Arial, sans-serif;
      font-weight: 700;
