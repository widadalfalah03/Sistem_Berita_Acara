<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>
  <style>
    .title {
      font-family: 'Segoe UI', Inter, Roboto, Arial, sans-serif;
      font-weight: 900;
      font-size: 76px;
      fill: #0067a9; 
      letter-spacing: 0.25em;
    }
    .subtitle {
      font-family: 'Segoe UI', Inter, Roboto, Arial, sans-serif;
      font-weight: 700;
      font-size: 19px;
      fill: #475569; 
      letter-spacing: 0.05em;
    }
  </style>

  <!-- The Icon Group -->
  <g transform="translate(300, 75) scale(1.15)">
    <!-- Folder Back (Red) -->
    <path d="M -40,-35 H -10 L 0,-20 H 40 A 6,6 0 0,1 46,-14 V 34 A 6,6 0 0,1 40,40 H -40 A 6,6 0 0,1 -46,34 V -29 A 6,6 0 0,1 -40,-35 Z" fill="#ed2124" />
    
    <!-- Document (Green) -->
    <g filter="url(#shadow)">
      <rect x="-26" y="-55" width="52" height="75" rx="4" fill="#b4c520" />
      <path d="M -12 -35 H 12 M -12 -20 H 12 M -12 -5 H 2" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
    </g>
    
    <!-- Folder Front (Blue) -->
    <path d="M -46, 5 L 46, -5 V 34 A 6,6 0 0,1 40,40 H -40 A 6,6 0 0,1 -46,34 Z" fill="#0067a9" filter="url(#shadow)" />
  </g>

  <!-- Main acronym text -->
  <text x="310" y="195" class="title" text-anchor="middle">SIMBA</text>
  <!-- Full name text -->
  <text x="300" y="225" class="subtitle" text-anchor="middle">SISTEM INFORMASI MANAJEMEN BERITA ACARA</text>
</svg>
